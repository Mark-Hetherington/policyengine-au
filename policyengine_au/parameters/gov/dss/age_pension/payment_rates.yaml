description: Maximum Age Pension rates per fortnight, before the income and assets tests. The Guide publishes yearly amounts; these are those amounts divided by 26 fortnights, which is exact to the cent.
metadata:
  unit: currency-AUD
  label: Age Pension maximum rates
  period: fortnight
  reference:
    - title: DSS Social Security Guide 5.2.2.10, Maximum basic rates of pension
      href: https://guides.dss.gov.au/social-security-guide/5/2/2/10
    - title: DSS Social Security Guide 5.2.8.10, Pension supplement historical rates
      href: https://guides.dss.gov.au/social-security-guide/5/2/8/10
    - title: DSS Social Security Guide 5.1.10.20, Energy supplement current rates
