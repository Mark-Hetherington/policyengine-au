description: Tax a complying superannuation fund pays on its own earnings. Earnings on assets supporting a retirement phase income stream are exempt.
metadata:
  label: Superannuation fund earnings tax
  reference:
    - title: Income Tax Rates Act 1986, s 26(1)(a)
      href: https://www.legislation.gov.au/C2004A03348/2026-07-01/2026-07-01/text/original/pdf
    - title: Income Tax Assessment Act 1997, s 295-385 (exempt current pension income)
      href: https://www.legislation.gov.au/C2004A05138/2026-07-01/2026-07-01/text/original/pdf/6
rate:
  description: Rate on the low tax component of a complying fund's taxable income.
  metadata:
    unit: /1
  values:
    2022-07-01: 0.15
discounted_capital_gains_rate:
  description: Effective rate on a discount capital gain, being the 15% rate less the one-third discount available to a complying superannuation entity.
  metadata:
    unit: /1
    reference:
      - title: Income Tax Assessment Act 1997, s 115-100(b)(i)
        href: https://www.legislation.gov.au/C2004A05138/2026-07-01/2026-07-01/text/original/pdf/3
