description: Age at which preserved superannuation benefits can be accessed on retirement. The rise from 55 to 60 finished in 2024-25, so from then it is 60 for everyone; the birth-year cohorts of the transition are not modelled.
values:
  2022-07-01: 59
  2024-07-01: 60
