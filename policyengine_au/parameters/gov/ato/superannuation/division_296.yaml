description: Division 296 tax, reducing the concessions on superannuation earnings attributable to a total super balance above the large super balance threshold. Applies from the 2026-27 income year.
metadata:
  label: Division 296 tax
  reference:
    - title: Treasury Laws Amendment (Building a Stronger and Fairer Super System) Act 2026
      href: https://www.legislation.gov.au/C2026A00009/asmade/text
    - title: ATO, Better targeted superannuation concessions
      href: https://www.ato.gov.au/about-ato/new-legislation/in-detail/superannuation/better-targeted-superannuation-concessions
    - title: ATO, About Division 296 tax for APRA funds
      href: https://www.ato.gov.au/tax-and-super-professionals/for-superannuation-professionals/apra-regulated-funds/managing-member-benefits/taxation-of-member-super-benefits/about-division-296-tax-for-apra-funds
large_balance_threshold:
  description: Total super balance above which the additional 15% applies. Indexed to CPI; the 2026-27 value is the first, and later values are added as the ATO publishes them rather than projected here.
  metadata:
    unit: currency-AUD
    period: year
    reference:
      - title: ATO, Better targeted superannuation concessions - "For the 2026-27 financial year, the LSBT will be $3 million"
        href: https://www.ato.gov.au/about-ato/new-legislation/in-detail/superannuation/better-targeted-superannuation-concessions
  values:
    2026-07-01: 3_000_000
very_large_balance_threshold:
  description: Total super balance above which a further 10% applies, on top of the 15%.
  metadata:
    unit: currency-AUD
    period: year
    reference:
      - title: ATO, Better targeted superannuation concessions - "the VLSBT will be $10 million"
        href: https://www.ato.gov.au/about-ato/new-legislation/in-detail/superannuation/better-targeted-superannuation-concessions
  values:
    2026-07-01: 10_000_000
rate:
  description: Additional tax on the share of earnings attributable to the balance above the large balance threshold.
  metadata:
    unit: /1
    reference:
      - title: ATO - "you will be subject to an additional tax of 15% on the proportion of your earnings relating to your TSB that exceeds the LSBT"
        href: https://www.ato.gov.au/about-ato/new-legislation/in-detail/superannuation/better-targeted-superannuation-concessions
  values:
    2026-07-01: 0.15
very_large_balance_rate:
  description: Further additional tax on the share of earnings attributable to the balance above the very large balance threshold. It stacks on the 15%, so earnings attributable to that tier bear 25% in total.
  metadata:
    unit: /1
    reference:
      - title: ATO - "an additional tax of 10% on the proportion of your earnings relating to your TSB that exceeds the VLSBT"
        href: https://www.ato.gov.au/about-ato/new-legislation/in-detail/superannuation/better-targeted-superannuation-concessions
  values:
    2026-07-01: 0.10
