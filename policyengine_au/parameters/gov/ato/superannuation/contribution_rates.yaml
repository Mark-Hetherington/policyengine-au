description: Superannuation guarantee, contribution caps and contributions tax.
metadata:
  label: Superannuation contributions
  reference:
    - title: ATO, Key superannuation rates and thresholds
      href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds
super_guarantee_rate:
  description: Minimum employer contribution as a share of an employee's qualifying earnings (ordinary time earnings for quarters ending on or before 30 June 2026).
  metadata:
    unit: /1
    reference:
      - title: ATO, Super guarantee (Table 21)
        href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/super-guarantee
  values:
    2022-07-01: 0.105
    2023-07-01: 0.11
    2024-07-01: 0.115
    2025-07-01: 0.12
maximum_contribution_base:
  description: Earnings above which no further super guarantee is required. Annual from 1 July 2026 under Payday Super. Earlier years are the quarterly base times four, which is the annual equivalent for even earnings.
  metadata:
    unit: currency-AUD
    period: year
    reference:
      - title: ATO, Super guarantee (Tables 23 and 24, maximum contribution base)
        href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/super-guarantee
  values:
    2022-07-01: 240_880  # 4 x $60,220 a quarter
    2023-07-01: 249_080  # 4 x $62,270 a quarter
    2024-07-01: 260_280  # 4 x $65,070 a quarter
    2025-07-01: 250_000  # 4 x $62,500 a quarter
    2026-07-01: 270_830
concessional_contribution_cap:
  description: General annual cap on concessional (before-tax) contributions, indexed to AWOTE.
  metadata:
    unit: currency-AUD
    period: year
    reference:
      - title: ATO, Contributions caps (Table 1)
        href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/contributions-caps
  values:
    2022-07-01: 27_500
    2023-07-01: 27_500
    2024-07-01: 30_000
    2025-07-01: 30_000
    2026-07-01: 32_500
non_concessional_contribution_cap:
  description: General annual cap on non-concessional (after-tax) contributions, a multiple of the concessional cap. Nil where total super balance reaches the general transfer balance cap, which is not modelled.
  metadata:
    unit: currency-AUD
    period: year
    reference:
      - title: ATO, Contributions caps (Table 4)
        href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/contributions-caps
  values:
    2022-07-01: 110_000
    2023-07-01: 110_000
    2024-07-01: 120_000
    2025-07-01: 120_000
    2026-07-01: 130_000
contributions_tax_rate:
  description: Tax a fund pays on concessional contributions.
  metadata:
    unit: /1
    reference:
      - title: ATO, Tax on contributions
        href: https://www.ato.gov.au/individuals-and-families/super-for-individuals-and-families/super/growing-your-super/tax-on-contributions
  values:
    2022-07-01: 0.15
division_293:
  description: Extra tax on concessional contributions for high income earners.
  metadata:
    reference:
      - title: ATO, Division 293 tax (Table 7)
        href: https://www.ato.gov.au/tax-rates-and-codes/key-superannuation-rates-and-thresholds/division-293-tax
  threshold:
    description: Income plus low tax contributions above which Division 293 tax applies.
    metadata:
      unit: currency-AUD
      period: year
    values:
      2022-07-01: 250_000
  rate:
    description: Rate of Division 293 tax on the lesser of the excess over the threshold and the low tax contributions.
    metadata:
      unit: /1
    values:
      2022-07-01: 0.15
