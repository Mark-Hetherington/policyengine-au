# The capital gains tax discount, and the net capital gain that lands in
# assessable income. A period of N reads parameters at N-01-01, so period
# 2027 is 2026-27 law: the discount is 50% for an individual, on gains on
# assets held twelve months or more.

- name: 2026-27 a gain on an asset held over a year is halved
  period: 2027
  input:
    people:
      person_1:
        discount_capital_gains: 100_000
  output:
    net_capital_gain: 50_000

- name: 2026-27 a gain on an asset held briefly is assessed in full
  period: 2027
  input:
    people:
      person_1:
        other_capital_gains: 100_000
  output:
    net_capital_gain: 100_000

- name: 2026-27 the two kinds of gain add
  period: 2027
  input:
    people:
      person_1:
        discount_capital_gains: 40_000
        other_capital_gains: 10_000
  output:
    net_capital_gain: 30_000  # 40,000 x 50% + 10,000

- name: 2026-27 a loss is nil rather than negative
  period: 2027
  input:
    people:
      person_1:
        discount_capital_gains: -20_000
  output:
    net_capital_gain: 0

- name: 2026-27 a net capital gain is assessable income
  period: 2027
  input:
    people:
      person_1:
        employment_income: 100_000
        discount_capital_gains: 50_000
  output:
    # $100,000 salary plus half of the $50,000 gain.
    taxable_income: 125_000

- name: 2026-27 a gain changes the tax, not just the income
  period: 2027
  input:
    people:
      person_1:
        employment_income: 100_000
        discount_capital_gains: 50_000
  output:
    # $125,000 taxable: $4,020 on the 15% bracket to $45,000 (the rate
    # steps 16% to 15% on 2026-07-01), plus 30% of the $80,000 above it.
    income_tax: 28_020
