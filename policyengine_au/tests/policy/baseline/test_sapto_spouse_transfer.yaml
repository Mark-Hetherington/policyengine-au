# Transfer of a spouse's unused SAPTO: Income Tax Assessment (1936 Act)
# Regulation 2015 / Regulations 2025, reg 12.
# A period of N reads parameters at N-01-01, so period 2026 is 2025-26 law.
# Transferring an amount also moves the recipient's rebate threshold.

# Age Pension is set to nil so each case isolates the offset: the ATO's
# examples give rebate income directly, with any pension already in it.
- name: 2025-26 ATO example 9, illness separated couple, $1,440 transferred
  period: 2026
  input:
    people:
      person_1:
        age: 70
        age_pension: 0
        is_illness_separated_couple: true
        employment_income: 48_000
      person_2:
        age: 70
        age_pension: 0
        is_illness_separated_couple: true
        employment_income: 10_000
    tax_units:
      tax_unit:
        primaries: [person_1]
        spouses: [person_2]
    households:
      household:
        members: [person_1, person_2]
  output:
    person_1:
      sapto_unused_transferred_in: 1_440  # $2,040 - ($10,000 - $6,000) x 0.15
      sapto_adjusted_base_amount: 3_480
      sapto_adjusted_rebate_threshold: 39_912
      seniors_and_pensioners_tax_offset: 2_469  # $3,480 - 12.5% of $8,088
    person_2:
      sapto_unused_transferred_out: 1_440
      sapto_adjusted_base_amount: 600
      seniors_and_pensioners_tax_offset: 600

- name: 2025-26 spouse below the $6,000 floor transfers the whole unused amount
  period: 2026
  input:
    people:
      person_1:
        age: 70
        age_pension: 0
        employment_income: 45_000
      person_2:
        age: 70
        age_pension: 0
        employment_income: 5_000
    tax_units:
      tax_unit:
        primaries: [person_1]
        spouses: [person_2]
    households:
      household:
        members: [person_1, person_2]
  output:
    person_1:
      sapto_offset_before_transfer: 0  # shaded out on the $1,602 base
      sapto_unused_transferred_in: 1_602
      sapto_adjusted_base_amount: 3_204
      # Above $37,000, so the threshold uses reg 9(6)-(7).
      sapto_adjusted_rebate_threshold: 39_035
      seniors_and_pensioners_tax_offset: 2_459  # $3,204 - 12.5% of $5,965
      income_tax_payable: 1_504  # $4,288 - $325 LITO - $2,459
    person_2:
      sapto_unused_transferred_out: 1_602
      sapto_adjusted_base_amount: 0
      seniors_and_pensioners_tax_offset: 0

- name: 2025-26 exempt pension income counts against the transfer (reg 12(5))
  period: 2026
  input:
    people:
      person_1:
        age: 70
        age_pension: 0
        employment_income: 40_000
      person_2:
        age: 70
        age_pension: 0
        employment_income: 0
        exempt_pension_income: 12_000
    tax_units:
      tax_unit:
        primaries: [person_1]
        spouses: [person_2]
    households:
      household:
        members: [person_1, person_2]
  output:
    person_1:
      sapto_unused_transferred_in: 702  # $1,602 - ($12,000 - $6,000) x 0.15
      sapto_adjusted_base_amount: 2_304
      sapto_adjusted_rebate_threshold: 35_382
      seniors_and_pensioners_tax_offset: 1_727
      income_tax_payable: 1_186  # $3,488 - $575 LITO - $1,727
    person_2:
      sapto_unused_transferred_out: 702
      seniors_and_pensioners_tax_offset: 900

- name: 2025-26 Vanh and Mai, spouse income too high for any transfer
  period: 2026
  input:
    people:
      vanh:
        age: 70
        age_pension: 0
        employment_income: 32_590
      mai:
        age: 70
        age_pension: 0
        employment_income: 26_780
    tax_units:
      tax_unit:
        primaries: [vanh]
        spouses: [mai]
    households:
      household:
        members: [vanh, mai]
  output:
    vanh:
      sapto_unused_transferred_in: 0  # formula amount is negative, so nil
      seniors_and_pensioners_tax_offset: 1_403
    mai:
      sapto_unused_transferred_out: 0
      seniors_and_pensioners_tax_offset: 1_602

- name: 2025-26 a single person transfers nothing
  period: 2026
  input:
    people:
      person_1:
        age: 70
        age_pension: 0
        employment_income: 5_000
  output:
    sapto_unused_transferred_in: 0
    sapto_unused_transferred_out: 0
    seniors_and_pensioners_tax_offset: 2_230
